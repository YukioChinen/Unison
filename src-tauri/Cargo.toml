[package]
name = "unison"
version = "0.1.0"
description = "Painel unificado de perifericos"
edition = "2021"

[lib]
name = "unison_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2"
serialport = { version = "4", default-features = false }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

# Binario pequeno e rapido
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
